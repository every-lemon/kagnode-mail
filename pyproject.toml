[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morrow-mail"
version = "0.1.0"
description = "A lightweight, native Ubuntu mail server with a thoughtful web interface"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = ["Flask>=3.0.2,<4", "cryptography>=41,<51", "gunicorn>=20.1,<27"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "playwright>=1.48,<2"]

[tool.setuptools.packages.find]
include = ["morrow*"]

[tool.setuptools.package-data]
morrow = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:'crypt' is deprecated:DeprecationWarning"]
