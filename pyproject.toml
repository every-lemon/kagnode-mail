[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kagnode-mail"
version = "0.4.1"
description = "KagNode Mail — a lightweight open source mail server for Ubuntu 24.04"
requires-python = ">=3.12,<3.13"
license = {text = "AGPL-3.0-only"}
dependencies = ["Flask>=3.0.2,<4", "cryptography>=41,<51", "gunicorn>=20.1,<27"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "playwright>=1.48,<2"]

[tool.setuptools.packages.find]
include = ["kagnode*"]

[tool.setuptools.package-data]
kagnode = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:'crypt' is deprecated:DeprecationWarning"]
