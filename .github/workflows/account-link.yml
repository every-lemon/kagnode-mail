name: Account link browser recovery
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    name: Account link browser (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    # WebKit system dependencies can exceed ten minutes on a cold runner.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install -e . playwright==1.58.0
      - run: playwright install --with-deps ${{ matrix.engine }}
      - run: python tests/browser_account_link.py
        env:
          KAGNODE_BROWSER_ENGINE: ${{ matrix.engine }}
      - name: Mail folder and settings navigation
        run: python tests/browser_navigation.py
        env:
          KAGNODE_BROWSER_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mail-navigation-${{ matrix.engine }}
          path: .build/navigation/
      - name: Local and KagNode sign-in journeys
        run: python tests/browser_provider.py
        env:
          KAGNODE_BROWSER_ENGINE: ${{ matrix.engine }}
