name: Validate KagNode Mail
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: python -m pytest -q
      - run: shellcheck install.sh scripts/*.sh tests/*.sh
      - run: playwright install --with-deps chromium
      - name: Browser flows
        run: |
          python scripts/demo.py > /tmp/kagnode-preview.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8025/ >/dev/null && break; sleep 1; done
          python tests/browser_check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: interface-screenshots
          path: docs/screenshots/
  native-mail:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Real Ubuntu 24.04 mail services
        run: |
          docker run --rm -v "$PWD:/src:ro" ubuntu:24.04 bash -c '
            touch /.kagnode-lab
            bash /src/tests/lab-install.sh prepare
            bash /src/tests/lab-install.sh test
          '
