name: Validate KagNode Mail
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - name: Path migration fixtures
        run: python3 scripts/check-migration.py
      - run: python -m pytest -q
      - run: shellcheck install.sh scripts/*.sh tests/*.sh
      - run: playwright install --with-deps chromium
      - name: Browser flows
        run: |
          python scripts/demo.py > /tmp/kagnode-preview.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8025/ >/dev/null && break; sleep 1; done
          python tests/browser_check.py
          python tests/browser_login_check.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: interface-screenshots
          path: docs/screenshots/
  native-mail:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Real Ubuntu 24.04 mail services
        run: |
          docker run --rm -v "$PWD:/src:ro" ubuntu:24.04 bash -c '
            touch /.kagnode-lab
            bash /src/tests/lab-install.sh prepare
            bash /src/tests/lab-install.sh test
          '
