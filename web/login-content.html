<div id="login-access" class="login-access" role="status" tabindex="-1" hidden>
  <p id="login-access-message"></p>
  <a id="secure-login-link" class="button" hidden
    >Open secure mail
    <span class="icon" data-core-icon="external" aria-hidden="true"></span
  ></a>
</div>
<form id="login-form">
  <div class="kn-core-login-field">
    <label for="login-email">Email address</label
    ><input
      id="login-email"
      name="email"
      type="email"
      autocomplete="username"
      placeholder="you@example.com"
      required
      maxlength="254"
    />
  </div>
  <div class="kn-core-login-field">
    <label for="login-password">Password</label
    ><input
      id="login-password"
      name="password"
      type="password"
      autocomplete="current-password"
      required
      maxlength="256"
    />
  </div>
  <p id="login-error" class="form-error" role="alert"></p>
  <button data-core-login-submit type="submit">Sign in</button>
</form>
<p id="provider-mailbox-note" role="status" hidden></p>
<a id="provider-local-login" href="/" hidden>Use local sign-in</a>
<p id="login-help" class="login-help">
  Contact your administrator for access or password resets.
</p>
<div id="demo-login" class="notice" hidden>
  Read-only preview<br /><strong>alex@example.com</strong> ·
  <strong>KagNodePreview2026!</strong>
</div>
<nav class="kn-core-login-links" aria-label="KagNode links">
  <a href="{{ kagnode_website }}">KagNode Website</a
  ><a
    href="https://github.com/every-lemon/kagnode-mail"
    target="_blank"
    rel="noreferrer"
    >Open source</a
  >
</nav>
